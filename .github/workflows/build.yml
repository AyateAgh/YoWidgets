name: Windows build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Audit publishable source
        run: node scripts/audit-source.mjs --history
      - name: Build and verify
        shell: pwsh
        run: ./scripts/build.ps1 -SkipVisualTests
      - name: Verify owned install and removal
        shell: pwsh
        run: ./tests/lifecycle.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: YoWidgets-windows-x64
          path: artifacts/install-payload/
          retention-days: 14
